<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IdeaGen | Proven Money-Making Ideas</title>
  <meta name="description" content="Discover AI-generated products that don't exist but definitely should. AI powered by Gemini.">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Tailwind Config (Local) -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: '#1a1d24',
            primary: '#6366f1',
          }
        }
      }
    }
  </script>

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="antialiased flex flex-col items-center">
  
  <!-- Navigation -->
  <nav class="w-full max-w-5xl mx-auto px-6 py-6 flex justify-between items-center relative z-10">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg">
        <i class="fa-solid fa-lightbulb text-white text-sm"></i>
      </div>
      <span class="font-bold text-xl tracking-tight">IdeaGen<span class="text-indigo-400">.ai</span></span>
    </div>
    <a href="/admin.html" class="text-sm font-medium text-gray-400 hover:text-white transition-colors">Admin</a>
  </nav>

  <!-- Main Content -->
  <main class="w-full max-w-4xl mx-auto px-6 py-12 flex flex-col items-center relative z-10 flex-grow">
    
    <!-- Hero Header -->
    <div class="text-center mb-12">
      <h1 class="text-5xl md:text-7xl font-extrabold mb-6 tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 drop-shadow-sm">
        Discover Your Next Big Business Idea
      </h1>
      <p class="text-lg text-gray-400 max-w-2xl mx-auto mb-8">
        Harnessing the power of AI to generate data-backed, proven money-making side hustles and businesses. Help train the AI by upvoting your favorites.
      </p>
      <div class="w-full max-w-xl mx-auto mb-8">
        <input type="text" id="userPromptInput" placeholder="Got a niche? e.g. A B2B SaaS for local bakeries..." class="w-full bg-surface border border-gray-700 rounded-xl px-6 py-4 text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all shadow-inner">
      </div>
      <button id="generateBtn" class="btn-primary px-8 py-4 rounded-full text-lg flex items-center gap-3 mx-auto">
        <i class="fa-solid fa-rocket"></i>
        <span>Generate Business Idea</span>
      </button>
    </div>

    <!-- Loading State -->
    <div id="loadingState" class="hidden w-full max-w-3xl glass-panel rounded-2xl p-8 mb-12">
      <div class="flex flex-col md:flex-row gap-8">
        <div class="w-full md:w-1/2 h-64 skeleton rounded-xl"></div>
        <div class="w-full md:w-1/2 flex flex-col gap-4 py-2">
          <div class="h-8 w-3/4 skeleton rounded"></div>
          <div class="h-6 w-1/4 skeleton rounded mb-4"></div>
          <div class="h-4 w-full skeleton rounded"></div>
          <div class="h-4 w-5/6 skeleton rounded"></div>
          <div class="h-4 w-4/6 skeleton rounded"></div>
        </div>
      </div>
    </div>

    <!-- Product Showcase -->
    <div id="productShowcase" class="hidden w-full max-w-3xl glass-panel rounded-2xl overflow-hidden mb-12 fade-in hover-scale">
      <div class="flex flex-col md:flex-row">
        <!-- Placeholder for image generated by prompt -->
        <div id="imageContainer" class="w-full md:w-5/12 bg-gray-800 relative p-8 flex flex-col justify-center items-center text-center border-r border-white/5 overflow-hidden">
          <img id="productImage" src="" alt="Generated Product" class="hidden absolute inset-0 w-full h-full object-cover z-10" />
          <i class="fa-regular fa-image text-4xl text-gray-600 mb-4 z-0"></i>
          <p class="text-xs text-gray-500 font-mono z-0 mb-4" id="productImagePrompt"></p>
          <button id="createImageBtn" class="z-20 mt-2 px-4 py-2 bg-indigo-500 hover:bg-indigo-600 rounded-lg text-sm font-medium transition-colors shadow-lg shadow-indigo-500/20">
            <i class="fa-solid fa-paintbrush mr-2"></i>Create Image
          </button>
          <div id="imageLoadingState" class="hidden absolute inset-0 bg-gray-800 flex flex-col justify-center items-center z-20">
            <i class="fa-solid fa-circle-notch fa-spin text-3xl text-indigo-500 mb-2"></i>
            <span class="text-sm text-gray-400">Rendering...</span>
          </div>
          <div class="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent pointer-events-none z-0"></div>
        </div>
        
        <!-- Product Details -->
        <div class="w-full md:w-7/12 p-8 flex flex-col">
          <div class="flex justify-between items-start mb-2">
            <h2 id="productName" class="text-3xl font-bold text-white"></h2>
            <div class="flex items-center gap-3">
              <span id="productPrice" class="text-xl font-medium text-indigo-400 bg-indigo-500/10 px-3 py-1 rounded-lg"></span>
              <button id="copyIdeaBtn" class="p-2 text-gray-400 hover:text-white transition-colors" title="Copy Idea to Clipboard">
                <i class="fa-regular fa-copy"></i>
              </button>
            </div>
          </div>
          
          <p id="productDesc" class="text-gray-400 mb-6 leading-relaxed"></p>
          
          <h3 class="text-sm font-semibold text-gray-300 uppercase tracking-wider mb-3">Key Features</h3>
          <ul id="productFeatures" class="space-y-2 flex-grow">
            <!-- Features injected here -->
          </ul>

          <h3 class="text-sm font-semibold text-gray-300 uppercase tracking-wider mb-3 mt-6">Existing Competition</h3>
          <ul id="productCompetitors" class="space-y-2 mb-8 flex-grow">
            <!-- Competitors injected here -->
          </ul>

          <!-- Thumbs Up/Down for specific idea -->
          <div class="pt-6 border-t border-white/10 flex items-center justify-between mb-8">
            <span class="text-sm text-gray-400">Would you build this?</span>
            <div class="flex gap-3">
              <button class="feedback-btn btn-icon w-10 h-10 rounded-full border border-gray-600 text-gray-400 flex items-center justify-center hover:text-green-400 hover:border-green-400" data-rating="1">
                <i class="fa-solid fa-arrow-trend-up"></i>
              </button>
              <button class="feedback-btn btn-icon w-10 h-10 rounded-full border border-gray-600 text-gray-400 flex items-center justify-center hover:text-red-400 hover:border-red-400" data-rating="-1">
                <i class="fa-solid fa-arrow-trend-down"></i>
              </button>
            </div>
          </div>

          <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="categoryOptions">
            <button class="category-feedback-btn p-4 rounded-xl border border-gray-700 bg-surface hover:bg-gray-700 transition-colors flex flex-col items-center gap-3 group" data-category="Micro-Tool">
              <i class="fa-solid fa-code text-2xl text-gray-400 group-hover:text-indigo-400 transition-colors"></i>
              <span class="text-sm font-medium">Micro-Tool</span>
            </button>
            <button class="category-feedback-btn p-4 rounded-xl border border-gray-700 bg-surface hover:bg-gray-700 transition-colors flex flex-col items-center gap-3 group" data-category="E-commerce">
              <i class="fa-solid fa-shopping-cart text-2xl text-gray-400 group-hover:text-indigo-400 transition-colors"></i>
              <span class="text-sm font-medium">E-commerce</span>
            </button>
            <button class="category-feedback-btn p-4 rounded-xl border border-gray-700 bg-surface hover:bg-gray-700 transition-colors flex flex-col items-center gap-3 group" data-category="Agency">
              <i class="fa-solid fa-users text-2xl text-gray-400 group-hover:text-indigo-400 transition-colors"></i>
              <span class="text-sm font-medium">Service Agency</span>
            </button>
            <button class="category-feedback-btn p-4 rounded-xl border border-gray-700 bg-surface hover:bg-gray-700 transition-colors flex flex-col items-center gap-3 group" data-category="Content Creator">
              <i class="fa-solid fa-video text-2xl text-gray-400 group-hover:text-indigo-400 transition-colors"></i>
              <span class="text-sm font-medium">Content & Media</span>
            </button>
          </div>
        </div>
      </div>
    </div>

  </main>

  <!-- Notification Toast -->
  <div id="toast" class="fixed bottom-6 right-6 glass-panel px-6 py-3 rounded-lg flex items-center gap-3 transform translate-y-20 opacity-0 transition-all duration-300 z-50">
    <i class="fa-solid fa-circle-check text-green-400"></i>
    <span id="toastMsg" class="text-sm font-medium">Feedback recorded!</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
